<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbalist Consultation</title>
</head>
<body>
    <header>
        <h1>Welcome to Herbalist Consultation</h1>
    </header>

    <!-- Other Content -->

    <!-- Updated form section starts here -->
    <form id="consultation-form" action="https://formspree.io/f/mpqjrekv" method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Consultation Message:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Submit</button>
    </form>
    <div id="thank-you-message" style="display:none;">
        <h2>Thank you for your submission!</h2>
    </div>
    <!-- Updated form section ends here -->

    <script>
        document.getElementById('consultation-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const formData = new FormData(this);
            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    this.reset();
                    document.getElementById('consultation-form').style.display = 'none';
                    document.getElementById('thank-you-message').style.display = 'block';
                } else {
                    alert('There was a problem with your submission.');
                }
            }).catch(error => {
                alert('There was a problem with your submission.');
            });
        });
    </script>
</body>
</html>
