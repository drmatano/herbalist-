<!-- Updated Consultation Form -->
<form id="consultation-form" action="https://formspree.io/f/mpqjrekv" method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <input type="submit" value="Submit">
</form>

<script>
document.getElementById('consultation-form').addEventListener('submit', function(event) {
    event.preventDefault(); // Prevent the default form submission
    const form = event.target;
    fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: {
            'Accept': 'application/json'
        }
    }).then(response => {
        if (response.ok) {
            form.reset(); // Reset form fields
            form.style.display = 'none'; // Hide form
            alert('Thank you for your submission!'); // Display thank you message
        } else {
            alert('There was a problem with your submission. Please try again.'); // Handle error
        }
    });
});
</script>
